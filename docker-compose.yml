# Dev environment: just Postgres. The web app and server run on the host via `pnpm dev`.
# Production compose lives in deploy/docker-compose.yml.

services:
  postgres:
    image: postgres:17-alpine
    container_name: cardball-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cardball
      POSTGRES_PASSWORD: cardball
      POSTGRES_DB: cardball
    ports:
      - "5432:5432"
    volumes:
      - cardball_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardball -d cardball"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cardball_pgdata:
